backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "rooms"
    label: "Hotel Rooms"
    files:
      - name: "rooms_list"
        label: "Manage Rooms"
        file: "_data/rooms.json"
        fields:
          - label: "Rooms"
            name: "rooms"
            widget: "list"
            fields:
              - { label: "Room Name", name: "title", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Image URL", name: "image", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
